<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COPI MAPA</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/estilos.css') }}">

</head>

<body>

<div class="contenedor">

    <div class="caja-login">

        <img src="{{ url_for('static', filename='img/COPIMAPA.png') }}"
        alt="Logo COPI MAPA">

        <h1>COPI MAPA</h1>

        <h2>SAN JOSÉ DEL RINCÓN</h2>

        <form action="/validar" method="POST">

            <input
            type="text"
            name="usuario"
            placeholder="Nombre completo COPIMAPA"
            required>

            <input
            type="password"
            name="password"
            placeholder="Contraseña"
            required>

            <button type="submit">
                INGRESAR
            </button>

        </form>

    </div>

</div>

</body>

</html>
